name = "dynamicqr-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Custom domain for the redirect engine (recommended for SEO and trust)
# routes = [
#   { pattern = "dynamicqrcodelabs.com/*", custom_domain = true },
# ]

# The Worker (redirect engine + API) is attached to qr.dynamicqrcodelabs.com
# via a Workers Custom Domain (managed via the Cloudflare API, not declared
# here). The apex dynamicqrcodelabs.com is free for the Pages marketing site.
# QR codes encode qr.dynamicqrcodelabs.com/q/<short_code>; the Astro site
# calls qr.dynamicqrcodelabs.com/api/* for auth and QR CRUD.

[[d1_databases]]
binding = "DB"
database_name = "dynamicqr-db"
database_id = "dbcbaf50-5675-4134-8db4-d00ce073c813"
migrations_dir = "drizzle"

# Cloudflare Email Sending (public beta — Workers Paid plan required).
# After onboarding the domain at:
#   Dashboard → Compute & AI → Email Service → Onboard Domain → dynamicqrcodelabs.com
# this binding lets the Worker call env.EMAIL.send({ to, from, subject, html, text })
# directly from the edge with no API key or external provider.
[[send_email]]
name = "EMAIL"

[vars]
ENVIRONMENT = "production"
PUBLIC_SITE_URL = "https://dynamicqrcodelabs.com"
SHORT_LINK_BASE = "https://qr.dynamicqrcodelabs.com/q"

# Secrets to set via `wrangler secret put`:
# JWT_SECRET — secret for signing session cookies
# IP_HASH_SALT — salt for hashing IP addresses

[observability]
enabled = true

[placement]
mode = "smart"
